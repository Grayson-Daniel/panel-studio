/* Layout: the animation fills the whole window; a white control panel floats over it on
   the right (a bottom sheet on phones) and can be hidden. No outlines: fills and spacing only. */
:root {
  --page: #FAF8F1;
  --panel: #FFFFFF;
  --fill: #FFFFFF;
  --fill-strong: #E7E9E1;
  --slider: #1A1C16;
  --slider-rest: #E2E4DC;
  --lift: 0 0 0 0 transparent, 0 1px 2px rgb(20 24 10 / .07), 0 2px 8px rgb(20 24 10 / .06);
  --panel-tint: #F5F6F2;
  --fg: #1A1C16;
  --muted: #6A6F62;
  --accent: #46520F;
  --accent-fg: #F4FBDC;
  --danger: #A2321F;
  --shadow: 0 1px 2px rgb(20 24 10 / .05), 0 6px 18px rgb(20 24 10 / .08);
  --font-display: "Saans", "Helvetica Neue", system-ui, sans-serif;
  --font-ui: "Saans", "Helvetica Neue", system-ui, sans-serif;
  --font-mono: "Saans", "Helvetica Neue", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --panel: #0E0F0C; --fill: #1C1E19; --lift: none; --panel-tint: #0E0F0C; --slider: #FFFFFF; --slider-rest: rgb(255 255 255 / .16); --fill-strong: #2E3228; --fg: #ECEEE6; --muted: #9AA091;
    --accent: #D3EE7C; --accent-fg: #1A1F08; --danger: #F08A72; --shadow: 0 1px 2px rgb(0 0 0 / .18), 0 6px 18px rgb(0 0 0 / .18); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --panel: #0E0F0C; --fill: #1C1E19; --lift: none; --panel-tint: #0E0F0C; --slider: #FFFFFF; --slider-rest: rgb(255 255 255 / .16); --fill-strong: #2E3228; --fg: #ECEEE6; --muted: #9AA091;
  --accent: #D3EE7C; --accent-fg: #1A1F08; --danger: #F08A72; --shadow: 0 1px 2px rgb(0 0 0 / .18), 0 6px 18px rgb(0 0 0 / .18); color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; overflow: hidden; }
body { background: var(--page); color: var(--fg); font-family: var(--font-ui); font-weight: 500; font-size: 14px; line-height: 1.45; }
button, select, input { font-weight: 500; }

/* the animation: the whole window */
#stage { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; }

/* floating control panel */
.panel {
  transform-origin: top right;
  position: fixed; z-index: 2;
  top: calc(16px + env(safe-area-inset-top, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px));
  right: max(16px, env(safe-area-inset-right, 0px)); width: var(--panel-w, 344px);
  background: var(--panel-tint); border-radius: 18px; box-shadow: var(--shadow);
  display: flex; flex-direction: column; overflow: hidden;
}
[hidden] { display: none !important; }
.panel[hidden] { display: none !important; }
/* The header floats over the scrolling content; below it a progressive blur fades the
   content out as it scrolls under, instead of a hard edge. */
.panel-head { position: absolute; top: 0; left: 0; right: 0; z-index: 1; padding: 16px 16px 12px; display: grid; gap: 12px; }
.panel-head::before {
  content: ""; position: absolute; inset: 0 0 -36px 0; z-index: -1; pointer-events: none;
  background: linear-gradient(to bottom, var(--panel) 0%, var(--panel) 50%, rgb(14 15 12 / .55) 78%, rgb(14 15 12 / 0) 100%);
  -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
  -webkit-mask-image: linear-gradient(to bottom, #000 0%, #000 55%, rgb(0 0 0 / .6) 78%, transparent 100%);
          mask-image: linear-gradient(to bottom, #000 0%, #000 55%, rgb(0 0 0 / .6) 78%, transparent 100%);
}
.player {
  position: fixed; z-index: 2; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); right: max(16px, env(safe-area-inset-right, 0px));
  width: var(--panel-w, 344px); background: var(--panel); border-radius: 16px; box-shadow: var(--shadow); padding: 10px 14px 8px;
}
body.panel-open .panel { bottom: calc(16px + env(safe-area-inset-bottom, 0px) + var(--player-h, 76px) + 10px); }
.dd-btn { width: 100%; justify-content: space-between; padding-inline: 14px; }
.dd-btn svg { width: 12px; height: 12px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; transition: transform .15s ease; }
.dd-btn[aria-expanded="true"] svg { transform: rotate(180deg); }
.menu button[aria-checked="true"] { background: var(--fill-strong); }
.lockup { display: flex; align-items: center; gap: 10px; margin: 0; }
.lockup .logo { height: 20px; width: auto; color: var(--fg); flex: none; }
.brand .lockup span { font-family: var(--font-display); font-weight: 500; font-size: 15px; color: var(--muted); letter-spacing: -0.01em; text-transform: none; margin-left: 0; white-space: nowrap; position: relative; top: 2.3px; /* sits on the wordmark's baseline */ }
.colors-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.link-btn { font: inherit; font-weight: 500; font-size: 12px; color: var(--muted); background: none; border: 0; padding: 2px 0; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }
.link-btn:hover { color: var(--fg); }
.brand { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.brand h1 { font-family: var(--font-display); font-weight: 700; font-size: 19px; letter-spacing: -0.01em; margin: 0; }
.brand h1 span { font-family: var(--font-ui); font-weight: 400; font-size: 11.5px; color: var(--muted); letter-spacing: 0.04em; text-transform: uppercase; margin-left: 6px; }
.icon-btn { width: 30px; height: 30px; border-radius: 50%; border: 0; background: #000; box-shadow: inset 0 1px 0 rgb(255 255 255 / .10), 0 1px 4px rgb(0 0 0 / .4); color: var(--fg); cursor: pointer; display: grid; place-items: center; }
.head-actions { display: flex; gap: 8px; flex: none; }
/* Retracted: just the header row */
.panel.retracted { bottom: auto !important; height: var(--head-h, 62px); }
.panel.retracted .scroll { visibility: hidden; }
.panel.retracted .panel-head::before { display: none; }
#retractBtn svg { transition: transform .3s cubic-bezier(0.22, 1, 0.36, 1); }
.panel.retracted #retractBtn svg { transform: rotate(180deg); }
/* Drag the left edge to resize */
.panel-resize { position: absolute; left: 0; top: 0; bottom: 0; width: 12px; z-index: 3; cursor: ew-resize; touch-action: none; }
.panel-resize::after { content: ""; position: absolute; left: 4px; top: 50%; width: 4px; height: 40px; margin-top: -20px; border-radius: 2px; background: rgb(255 255 255 / .28); opacity: 0; transition: opacity .15s ease; }
.panel-resize:hover::after, .panel-resize.dragging::after { opacity: 1; }
body.resizing, body.resizing * { cursor: ew-resize !important; user-select: none; }
@media (max-width: 720px) { .panel-resize, #retractBtn { display: none; } }
.icon-btn svg { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; }
.scroll { flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; padding: calc(var(--head-h, 58px) + 4px) 16px 16px; display: flex; flex-direction: column; }
/* scrolling stays, scrollbars go */
.panel .scroll, .panel .swatches { scrollbar-width: none; -ms-overflow-style: none; }
.panel .scroll::-webkit-scrollbar, .panel .swatches::-webkit-scrollbar { display: none; width: 0; height: 0; }

.show-panel {
  position: fixed; z-index: 2; top: calc(16px + env(safe-area-inset-top, 0px)); right: max(16px, env(safe-area-inset-right, 0px));
  border: 0; border-radius: 999px; color: var(--fg); background: var(--panel); box-shadow: var(--shadow);
  font: inherit; font-weight: 500; font-size: 13px; padding: 9px 14px; cursor: pointer; display: flex; gap: 8px; align-items: center;
}
.show-panel svg { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; }

/* segmented choices */
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: var(--fill); box-shadow: var(--lift); border-radius: 10px; padding: 3px; gap: 3px; }
.seg button { font: inherit; font-size: 13px; color: var(--muted); background: transparent; border: 0; border-radius: 8px; padding: 7px 10px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--fg); color: var(--fill); }
button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--slider); outline-offset: 2px; }

/* transport */
.transport { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 10px; align-items: center; }
.play { width: 34px; height: 34px; border-radius: 50%; border: 0; background: var(--fg); color: var(--panel); cursor: pointer; display: grid; place-items: center; }
.play svg { width: 12px; height: 12px; fill: currentColor; }
.timeline { position: relative; height: 34px; min-width: 0; }
.timeline .track { position: absolute; left: 0; right: 0; top: 20px; height: 4px; border-radius: 2px; background: var(--fill-strong); }
.timeline .phase { position: absolute; top: 0; height: 15px; padding-left: 5px; border-left: 2px solid var(--slider); font-size: 10px; letter-spacing: 0.05em; text-transform: uppercase; color: var(--muted); white-space: nowrap; overflow: hidden; }
.timeline .phase-bar { position: absolute; top: 20px; height: 4px; border-radius: 2px; background: var(--slider); opacity: .55; }
.timeline .head { position: absolute; top: 15px; width: 3px; height: 14px; background: var(--fg); border-radius: 2px; transform: translateX(-1px); pointer-events: none; }
.timeline input[type=range] { position: absolute; inset: 12px 0 0 0; width: 100%; height: 22px; opacity: 0; cursor: pointer; margin: 0; }
.clock { grid-column: 2; margin-top: -6px; font-family: var(--font-mono); font-variant-numeric: tabular-nums; font-size: 11.5px; color: var(--muted); }
.clock b { color: var(--fg); font-weight: 500; }

/* sections */
.section { padding-block: 14px; display: flex; flex-direction: column; gap: 12px; }
.panel button, .panel label, .player { -webkit-user-select: none; user-select: none; }
.sec-toggle { all: unset; box-sizing: border-box; display: flex; align-items: center; justify-content: space-between; gap: 8px; width: 100%; cursor: pointer; border-radius: 6px; }
.sec-toggle:focus-visible { outline: 2px solid var(--slider); outline-offset: 3px; }
.sec-toggle svg { width: 12px; height: 12px; flex: none; stroke: var(--muted); fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; transition: transform .25s cubic-bezier(0.22, 1, 0.36, 1); }
.section.collapsed .sec-toggle svg { transform: rotate(-90deg); }
.colors-head .sec-toggle { width: auto; flex: 1; }
.section-body { display: grid; grid-template-columns: minmax(0, 1fr); grid-template-rows: 1fr; min-width: 0; transition: grid-template-rows .3s cubic-bezier(0.22, 1, 0.36, 1), opacity .2s ease; }
.section-inner { min-height: 0; min-width: 0; display: flex; flex-direction: column; gap: 12px; }
.section.collapsed { gap: 0; }
.section.collapsed .section-body { grid-template-rows: 0fr; opacity: 0; }
.section.collapsed .section-inner, .section.moving .section-inner { overflow: hidden; }
@media (prefers-reduced-motion: reduce) { .section-body, .sec-toggle svg { transition: none; } }
.section + .section { padding-top: 22px; }
.section h2 { font-family: var(--font-display); font-weight: 600; font-size: 13px; letter-spacing: 0.02em; margin: 0; display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.section h2 small { font-family: var(--font-ui); font-weight: 400; color: var(--muted); font-size: 11.5px; letter-spacing: 0; }
.meta { display: grid; grid-template-columns: auto 1fr; gap: 3px 12px; font-size: 12.5px; margin: 0; }
.meta dt { color: var(--muted); }

.ctrl { display: grid; gap: 3px; }

input[type=range] { width: 100%; accent-color: var(--accent); margin: 2px 0; }
input.slider { -webkit-appearance: none; appearance: none; height: 18px; background: transparent; margin: 0; cursor: pointer; --p: 50%; }

input.slider::-moz-range-track { height: 4px; border-radius: 2px; background: var(--slider-rest); border: 0; }
input.slider::-moz-range-progress { height: 4px; border-radius: 2px; background: var(--slider); }
input.slider::-moz-range-thumb { width: 14px; height: 14px; border-radius: 50%; background: var(--slider); border: 0; box-shadow: 0 1px 3px rgb(0 0 0 / .25); }
.toggle { display: flex; align-items: center; justify-content: space-between; gap: 8px; width: 100%; font: inherit; font-weight: 500; font-size: 13px; color: var(--fg); background: none; border: 0; padding: 4px 0; cursor: pointer; text-align: left; }

  function fitMini() {
    var ar = aspectRatio(), box = 130, w = ar >= 1 ? box * Math.min(ar, 2.2) : box * ar, h = w / ar;
    if (h > box) { h = box; w = h * ar; }
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    mini.style.width = Math.round(w) + 'px'; mini.style.height = Math.round(h) + 'px';
    mini.width = Math.round(w * dpr); mini.height = Math.round(h * dpr);
  }

  function tick(now) {
    var dt = Math.min(0.1, (now - last) / 1000); last = now;
    if (playing && anim) time = (time + dt) % anim.loop;
    if (anim) {
      anim.render(time, canvas.width, canvas.height);
      updateClock();
      if (state.panel) miniAnim.render(time, mini.width, mini.height);
    }
    requestAnimationFrame(tick);
  }
  function updateClock() {
    $('clock').innerHTML = '<b>' + time.toFixed(2) + '</b> / ' + anim.loop.toFixed(2) + ' s';
    var f = time / anim.loop; $('playhead').style.left = (f * 100) + '%';
    if (document.activeElement !== $('scrub')) $('scrub').value = Math.round(f * 1000);
  }
  function drawPhases() {
    var box = $('phases'); box.textContent = '';
    anim.phases.forEach(function (p) {
      var l = p.start / anim.loop * 100, w = (p.end - p.start) / anim.loop * 100;
      var tag = document.createElement('div'); tag.className = 'phase'; tag.style.left = l + '%'; tag.style.width = w + '%'; tag.textContent = p.label;
      var bar = document.createElement('div'); bar.className = 'phase-bar'; bar.style.left = l + '%'; bar.style.width = w + '%';
      box.appendChild(tag); box.appendChild(bar);
    });
  }
  function setPlaying(v) {
    playing = v; $('playBtn').setAttribute('aria-label', v ? 'Pause' : 'Play');
    $('playIcon').innerHTML = v ? '<rect x="2" y="1" width="3.5" height="12" rx="1"/><rect x="8.5" y="1" width="3.5" height="12" rx="1"/>' : '<path d="M3 1.5v11a.8.8 0 0 0 1.2.7l9-5.5a.8.8 0 0 0 0-1.4l-9-5.5A.8.8 0 0 0 3 1.5z"/>';
  }
  $('playBtn').addEventListener('click', function () { setPlaying(!playing); });
  $('scrub').addEventListener('input', function (e) { setPlaying(false); time = e.target.value / 1000 * anim.loop; });
  document.addEventListener('keydown', function (e) {
    if (e.code === 'Space' && !/INPUT|SELECT|BUTTON|TEXTAREA/.test(document.activeElement.tagName)) { e.preventDefault(); setPlaying(!playing); }
  });

  // ---- inspector ----
  function fmt(item, v) { return (item.step >= 1 ? String(Math.round(v)) : (+v).toFixed(item.step < 0.01 ? 3 : 2)) + (item.unit ? (item.unit === 's' ? ' s' : item.unit) : ''); }
  function updateMeta() {
    var eng = E[state.kind], f = eng.frame;
    var fs = $('figmaShape'), ar = f.w / f.h; fs.style.width = Math.round(20 * Math.min(1, ar)) + 'px'; fs.style.height = Math.round(20 / Math.max(1, ar)) + 'px';
  }
  // Section titles open and close their section; remembered per section name.
  var CHEVRON = '<svg viewBox="0 0 12 12" aria-hidden="true"><path d="M2.5 4.5 6 8l3.5-3.5"/></svg>';
  function makeCollapsible(sec) {
    var h2 = sec.querySelector(':scope > h2, :scope > .colors-head > h2'); if (!h2) return;
    var head = h2.parentElement === sec ? h2 : h2.parentElement, name = h2.textContent.trim();
    var body = document.createElement('div'); body.className = 'section-body';
    var inner = document.createElement('div'); inner.className = 'section-inner'; body.appendChild(inner);
    [].slice.call(sec.children).forEach(function (c) { if (c !== head) inner.appendChild(c); });
    sec.appendChild(body);
    var btn = document.createElement('button'); btn.type = 'button'; btn.className = 'sec-toggle';
    btn.innerHTML = '<span></span>' + CHEVRON; btn.firstChild.textContent = name;
    h2.textContent = ''; h2.appendChild(btn);
    var id = 'sec-' + name.toLowerCase().replace(/\W+/g, '-') + '-' + Math.random().toString(36).slice(2, 6);
    body.id = id; btn.setAttribute('aria-controls', id);
    var set = function (closed, animate) {
      sec.classList.toggle('collapsed', closed); btn.setAttribute('aria-expanded', String(!closed)); body.inert = closed;
      if (animate) { sec.classList.add('moving'); setTimeout(function () { sec.classList.remove('moving'); }, 320); }
    };
    set(!!state.collapsed[name], false);
    btn.addEventListener('click', function () { var closed = !sec.classList.contains('collapsed'); state.collapsed[name] = closed; set(closed, true); persist(); });
  }
  function buildControls() {
    var host = $('controls'), S = state.settings[state.kind]; host.textContent = '';
    (CONTROLS[state.kind] || CONTROLS.conveyor).forEach(function (g) {
      var sec = document.createElement('div'); sec.className = 'section';
      var h = document.createElement('h2'); h.textContent = g.group;
      if (g.colors) {
        var head = document.createElement('div'); head.className = 'colors-head'; head.appendChild(h);
        var rc = document.createElement('button'); rc.type = 'button'; rc.className = 'link-btn'; rc.textContent = 'Reset colors';
        rc.addEventListener('click', function () { if (state.mode === 'moon') S.moonColors3 = moonPalette(state.kind); else S.colors = clone(E[state.kind].defaults.colors); discardRender(); buildControls(); rebuild(); persist(); toast('Colors reset to the Figma originals'); });
        head.appendChild(rc); sec.appendChild(head);
      } else sec.appendChild(h);
      (g.toggles || []).forEach(function (t) {
        var row = document.createElement('button'); row.type = 'button'; row.className = 'toggle'; row.id = 'c-' + state.kind + '-' + t[0]; row.setAttribute('role', 'checkbox');
        var paint = function () { row.setAttribute('aria-checked', String(!!S[t[0]])); row.innerHTML = '<span>' + t[1] + '</span>' + (S[t[0]] ? CHECK_ON : CHECK_OFF); };
        paint();
        row.addEventListener('click', function () { S[t[0]] = !S[t[0]]; paint(); rebuild(); persist(); });
        sec.appendChild(row);
      });
      (g.items || []).forEach(function (it) {
        var id = 'c-' + state.kind + '-' + it.key, wrap = document.createElement('div'); wrap.className = 'ctrl';
        wrap.innerHTML = '<div class="row"><label for="' + id + '">' + it.label + '</label><output for="' + id + '"></output></div>' +
          '<input type="range" class="slider" id="' + id + '" min="' + it.min + '" max="' + it.max + '" step="' + it.step + '">' + (it.hint ? '<div class="hint">' + it.hint + '</div>' : '');
        var input = wrap.querySelector('input'), out = wrap.querySelector('output');
        var fill = function () { input.style.setProperty('--p', ((input.value - it.min) / (it.max - it.min) * 100) + '%'); };
        input.value = S[it.key]; out.textContent = fmt(it, S[it.key]); fill();
        input.addEventListener('input', function () { S[it.key] = +input.value; out.textContent = fmt(it, S[it.key]); fill(); rebuild(); persist(); });
        sec.appendChild(wrap);
      });
      if (g.colors) {
        var grid = document.createElement('div'); grid.className = 'swatches';
        // Sun / Moon switch for the illustration, at the top of Colors
        var modes = document.createElement('div'); modes.className = 'seg'; modes.setAttribute('role', 'group'); modes.setAttribute('aria-label', 'Light');
        modes.innerHTML = '<button type="button" data-mode="sun">Sun rays</button><button type="button" data-mode="moon">Moon rays</button>';
        [].forEach.call(modes.children, function (b) { b.setAttribute('aria-pressed', String(b.dataset.mode === state.mode)); });
        modes.addEventListener('click', function (e) { var b = e.target.closest('button'); if (!b || b.dataset.mode === state.mode) return;
          state.mode = b.dataset.mode; discardRender(); buildControls(); rebuild(); persist(); toast(state.mode === 'moon' ? 'Moon rays' : 'Sun rays'); });
        sec.appendChild(modes);
        var CO = palette(state.kind);
        g.colors.forEach(function (c) {
          var id = 'c-' + state.kind + '-' + c[0], sw = document.createElement('label'); sw.className = 'swatch'; sw.htmlFor = id;
          sw.innerHTML = '<input type="color" id="' + id + '"><span>' + c[1] + '</span><code></code>';
          var input = sw.querySelector('input'), code = sw.querySelector('code');
          input.value = CO[c[0]].toLowerCase(); code.textContent = CO[c[0]];
          input.addEventListener('input', function () {
            CO[c[0]] = input.value.toUpperCase(); (c[2] || []).forEach(function (k) { CO[k] = input.value.toUpperCase(); });
            code.textContent = CO[c[0]]; rebuild(); persist();
          });
          grid.appendChild(sw);
        });
        sec.appendChild(grid);
      }
      host.appendChild(sec); makeCollapsible(sec);
    });
  }
  function selectKind(k) {
    state.kind = k;
    markKind();
    discardRender(); buildControls(); rebuild(); fitMini(); persist();
  }
  var KINDS = Object.keys(E).sort(function (a, b) { return E[a].number - E[b].number; });
  $('kindSelect').innerHTML = KINDS.map(function (k) { return '<option value="' + k + '">#' + Math.floor(E[k].number) + (E[k].number % 1 ? 'b' : '') + ' · ' + E[k].name + '</option>'; }).join('');
  function markKind() { $('kindSelect').value = state.kind; }
  $('kindSelect').addEventListener('change', function () { selectKind(this.value); });

  function applyAspect() { document.querySelectorAll('#sizeSeg button').forEach(function (b) { b.setAttribute('aria-pressed', String(b.dataset.aspect === state.aspect)); }); fitMini(); updateSizeNote(); }
  $('sizeSeg').addEventListener('click', function (e) { var b = e.target.closest('button'); if (!b) return; state.aspect = b.dataset.aspect; discardRender(); applyAspect(); persist(); });
  ['res', 'fps', 'loops'].forEach(function (id) {
    $(id).value = state[id];
    $(id).addEventListener('change', function () { state[id] = $(id).value; discardRender(); updateSizeNote(); persist(); });
  });
  // Estimated download size. The encoder aims for a bitrate set by size and frame rate; these
  // smooth gradients come out at about a fifth of it (measured: 1080p Fan, 14 s = 2.8 MB), and each finished render
  // re-measures that share for the illustration so later estimates get closer.
  var sizeShare = { fan: 0.19, peaks: 0.19 };
  function targetBitrate(w, h, fps) { return Math.round(Math.min(60e6, w * h * fps * 0.14)); }
  function fmtBytes(b) { return b >= 1e9 ? (b / 1e9).toFixed(2) + ' GB' : b >= 1e6 ? (b / 1e6).toFixed(1) + ' MB' : Math.max(1, Math.round(b / 1e3)) + ' KB'; }
  function updateSizeNote() {
    if (!anim) return; var s = exportSize(), fps = +state.fps, secs = anim.loop * +state.loops;
    var est = targetBitrate(s.w, s.h, fps) * secs / 8 * (sizeShare[state.kind] || 0.19);
    var code = $('engine-src').textContent.length + 1600;
    $('sizeNote').textContent = s.w + ' × ' + s.h + ' · ' + fps + ' fps · ' + secs.toFixed(1) + ' s · ' + Math.round(secs * fps) + ' frames · about ' + fmtBytes(est);
    $('exportSelect').querySelector('option[value="video"]').textContent = 'Video (MP4) · about ' + fmtBytes(est);
    $('exportSelect').querySelector('option[value="code"]').textContent = 'Code (HTML) · ' + fmtBytes(code);
  }
  $('resetBtn').addEventListener('click', function () {
    state.settings[state.kind] = clone(E[state.kind].defaults); discardRender(); buildControls(); rebuild(); persist(); toast('Reset ' + E[state.kind].name + ' to the Figma defaults');
  });

  // ---- saving files: the viewer's save prompt inside Claude, a normal download elsewhere ----
  var downloadsP = (window.claude && window.claude.use) ? window.claude.use('downloads') : Promise.resolve(undefined);
  async function offerFile(filename, blob) {
    var dl = await downloadsP;
    if (dl === null) { toast('Saving files isn’t available in this view.'); return false; }
    if (dl) {
      try { await dl.save({ filename: filename, data: blob }); toast('Saved ' + filename); return true; }
      catch (err) {
        var code = err && err.code;
        if (code === 'declined') toast('Save cancelled');
        else if (code === 'rate_limited') toast('A save prompt is already open. Try again in a moment.');
        else if (code === 'too_large') toast('That file is too large to save here. Try a lower resolution.');
        else toast('Saving isn’t available here right now.');
        return false;
      }
    }
    var a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = filename; document.body.appendChild(a); a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 2000); toast('Downloaded ' + filename); return true;
  }
  var toastTimer;
  function toast(msg) { var t = $('toast'); t.textContent = msg; t.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(function () { t.hidden = true; }, 3200); }

  // ---- dropdowns ----
  function dropdown(btnId, menuId) {
    var b = $(btnId), m = $(menuId);
    function set(open) { m.hidden = !open; b.setAttribute('aria-expanded', String(open)); if (open) { var f = m.querySelector('[aria-checked="true"]') || m.querySelector('button:not(:disabled)'); if (f) f.focus(); } }
    b.addEventListener('click', function () { set(m.hidden); });
    m.addEventListener('click', function (e) { if (e.target.closest('button')) set(false); });
    document.addEventListener('click', function (e) { if (!m.hidden && !b.contains(e.target) && !m.contains(e.target)) set(false); });
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && !m.hidden) { set(false); b.focus(); } });
  }
  $('exportSelect').addEventListener('change', function () {
    var v = this.value; this.value = '';
    if (v === 'video') $('renderBtn').click(); else if (v === 'code') $('codeBtn').click();
  });

  // ---- code export: one self-contained HTML file with the engine and current settings ----
  $('codeBtn').addEventListener('click', function () {
    var eng = E[state.kind], S = eff(state.kind), bg = eng.create(S, document.createElement('canvas').getContext('2d')).background;
    var src = (E[state.kind].number === 1 || E[state.kind].number === 3 ? '' : 'var RAYCASH_ILLUSTRATIONS = ' + JSON.stringify((function () { var o = {}; o[eng.id] = RAYCASH_ILLUSTRATIONS[eng.id]; return o; })()) + ';\n') + $('engine-src').textContent;
    var html = '<!doctype html>\n<html lang="en">\n<head>\n<meta charset="utf-8">\n<meta name="viewport" content="width=device-width, initial-scale=1">\n' +
      '<title>Raycash ' + eng.name + '</title>\n<style>html,body{margin:0;height:100%;background:' + bg + ';overflow:hidden}canvas{display:block;width:100vw;height:100vh}</style>\n</head>\n<body>\n<canvas id="c"></canvas>\n' +
      '<script>' + src + '<\/script>\n<script>\n// Settings exported from Raycash Panel Studio. Edit and reload to change the motion.\n' +
      'var SETTINGS = ' + JSON.stringify(S, null, 2) + ';\n' +
      'var canvas = document.getElementById("c"), ctx = canvas.getContext("2d");\n' +
      'var anim = RaycashEngines.' + eng.id + '.create(SETTINGS, ctx), W = 0, H = 0;\n' +
      'function resize() { var d = Math.min(window.devicePixelRatio || 1, 2); W = canvas.width = Math.round(innerWidth * d); H = canvas.height = Math.round(innerHeight * d); }\n' +
      'addEventListener("resize", resize); resize();\n' +
      'var start = performance.now();\n' +
      'function draw(now) { anim.render((now - start) / 1000, W, H); requestAnimationFrame(draw); }\n' +
      'requestAnimationFrame(draw);\n<\/script>\n</body>\n</html>\n';
    offerFile('raycash-' + eng.id + (state.mode === 'moon' ? '-moon' : '') + '.html', new Blob([html], { type: 'text/html' }));
  });

  // ---- video export: frame-by-frame render, WebCodecs encode, MP4 (or WebM) mux ----
  var rendered = null, cancelFlag = false, busy = false;
  function discardRender() { rendered = null; $('saveRow').hidden = true; }
  $('discardBtn').addEventListener('click', function () { discardRender(); $('exportNote').className = 'note'; $('exportNote').textContent = 'Discarded the rendered video.'; });
  $('cancelBtn').addEventListener('click', function () { cancelFlag = true; });
  $('saveBtn').addEventListener('click', function () { if (rendered) offerFile(rendered.name, rendered.blob); });

  async function pickCodec(w, h, fps, bitrate) {
    if (typeof VideoEncoder === 'undefined') return null;
    var tries = [];
    if (window.Mp4Muxer) ['avc1.640034', 'avc1.640033', 'avc1.4d0034', 'avc1.42003e'].forEach(function (c) { tries.push({ c: c, fmt: 'mp4', mux: 'avc' }); });
    if (window.WebMMuxer) [['vp09.00.51.08', 'V_VP9'], ['vp8', 'V_VP8']].forEach(function (c) { tries.push({ c: c[0], fmt: 'webm', mux: c[1] }); });
    for (var i = 0; i < tries.length; i++) {
      var cfg = { codec: tries[i].c, width: w, height: h, bitrate: bitrate, framerate: fps };
      try { var s = await VideoEncoder.isConfigSupported(cfg); if (s.supported) return Object.assign({ cfg: cfg }, tries[i]); } catch (e) {}
    }
    return null;
  }

  $('renderBtn').addEventListener('click', async function () {
    if (busy) return;
    var size = exportSize(), fps = +state.fps, eng = E[state.kind], S = clone(eff(state.kind));
    var bitrate = targetBitrate(size.w, size.h, fps);
    var note = $('exportNote'); note.className = 'note';
    var choice = await pickCodec(size.w, size.h, fps, bitrate);
    if (!choice) { note.className = 'note error'; note.textContent = 'This browser can’t encode video here. Open the page in Chrome, Edge or Safari 17 or later.'; return; }

    busy = true; cancelFlag = false; discardRender();
    $('renderBtn').disabled = true; $('exportSelect').disabled = true; $('progress').hidden = false; $('progressBar').style.width = '0%';
    var off = document.createElement('canvas'); off.width = size.w; off.height = size.h;
    var octx = off.getContext('2d', { alpha: false });
    var a = eng.create(S, octx), total = Math.round(a.loop * +state.loops * fps);
    var muxer = choice.fmt === 'mp4'
      ? new Mp4Muxer.Muxer({ target: new Mp4Muxer.ArrayBufferTarget(), video: { codec: 'avc', width: size.w, height: size.h }, fastStart: 'in-memory' })
      : new WebMMuxer.Muxer({ target: new WebMMuxer.ArrayBufferTarget(), video: { codec: choice.mux, width: size.w, height: size.h, frameRate: fps } });
    var failure = null;
    var encoder = new VideoEncoder({ output: function (chunk, meta) { muxer.addVideoChunk(chunk, meta); }, error: function (e) { failure = e; } });
    encoder.configure(Object.assign({ latencyMode: 'quality' }, choice.cfg, choice.fmt === 'mp4' ? { avc: { format: 'avc' } } : {}));
    var started = performance.now();
    try {
      for (var i = 0; i < total; i++) {
        if (cancelFlag) throw new Error('cancelled');
        if (failure) throw failure;
        a.render(i / fps, size.w, size.h);
        var frame = new VideoFrame(off, { timestamp: Math.round(i * 1e6 / fps), duration: Math.round(1e6 / fps) });
        encoder.encode(frame, { keyFrame: i % (fps * 2) === 0 }); frame.close();
        while (encoder.encodeQueueSize > 6) await new Promise(function (r) { setTimeout(r, 1); });
        if (i % 3 === 0 || i === total - 1) {
          var done = (i + 1) / total, el = (performance.now() - started) / 1000, left = el / done - el;
          $('progressBar').style.width = (done * 100).toFixed(1) + '%';
          $('progressText').textContent = 'Rendering frame ' + (i + 1) + ' of ' + total + (i > 10 ? ' · about ' + Math.ceil(left) + ' s left' : '');
          await new Promise(function (r) { setTimeout(r, 0); });
        }
      }
      $('progressText').textContent = 'Finishing the file…';
      await encoder.flush(); if (failure) throw failure;
      muxer.finalize();
      var blob = new Blob([muxer.target.buffer], { type: choice.fmt === 'mp4' ? 'video/mp4' : 'video/webm' });
      var label = state.aspect === 'figma' ? 'figma' : state.aspect.replace(':', 'x');
      if (choice.fmt === 'mp4') { sizeShare[eng.id] = blob.size * 8 / (bitrate * total / fps); updateSizeNote(); }
      rendered = { blob: blob, name: 'raycash-' + eng.id + (state.mode === 'moon' ? '-moon' : '') + '-' + label + '-' + size.w + 'x' + size.h + '-' + fps + 'fps.' + choice.fmt };
      $('saveBtn').textContent = 'Save ' + choice.fmt.toUpperCase() + ' · ' + fmtBytes(blob.size);
      $('saveRow').hidden = false;
      note.textContent = 'Rendered ' + total + ' frames in ' + ((performance.now() - started) / 1000).toFixed(0) + ' s' + (choice.fmt === 'webm' ? '. This browser can’t make MP4 here, so it’s WebM.' : '.');
    } catch (err) {
      try { encoder.close(); } catch (e) {}
      if (err && err.message === 'cancelled') { note.textContent = ''; discardRender(); }
      else { note.className = 'note error'; note.textContent = 'The render stopped: ' + (err && err.message ? err.message : err) + '. Try a lower resolution.'; }
    } finally {
      busy = false; $('renderBtn').disabled = false; $('exportSelect').disabled = false; $('progress').hidden = true; $('progressBar').style.width = '0%'; $('progressText').textContent = 'Preparing…';
      try { if (encoder.state !== 'closed') encoder.close(); } catch (e) {}
    }
  });

  // ---- boot ----
  applyTheme(); applyPanel();
  markKind();
  setPanelWidth(state.panelW);
  setPlaying(playing); buildControls(); rebuild(); fitStage(); applyAspect(); measurePlayer(); applyRetract(false);
  makeCollapsible($('sizeSeg').closest('.section'));
  makeCollapsible($('res').closest('.section'));
  requestAnimationFrame(function (n) { last = n; tick(n); });
})();
</script>
